name: CI

# CI гоняем только в этом репозитории: в зеркале, форке или приватной копии эти
# задания съедали бы 90 % бесплатных минут GitHub Actions (Windows считается ×2),
# а полный набор тестов там и так прогоняется локально перед пушем. У каждого
# задания ниже — if на этот репозиторий: в остальных копиях они пропускаются.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Один прогон на ветку: новый пуш отменяет предыдущий, чтобы очередь не копилась.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'mxmlab/reelsi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      # Без него часть тестов сама себя пропускает (13 штук), а doctor честно
      # ставит FAIL — то есть проверяется меньше, чем кажется по зелёной галочке.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-сборка torch: она в разы легче CUDA-колеса, а тестам контрактов
          # видеокарта не нужна — они проверяют разметку и XML, а не инференс.
          # Индекс pytorch ДОПОЛНЯЕТ PyPI (extra-index-url), а не заменяет его:
          # замена отдаёт PyPI целиком в пользу индекса pytorch, а там
          # typing-extensions есть только исходником, и его сборка требует
          # flit_core, которого в том индексе нет —
          # ERROR: Could not find a version that satisfies the requirement flit_core<4,>=3.11.
          # Зелено сейчас только за счёт кэша pip у setup-python: сбросится кэш —
          # джоба упадёт на ровном месте. Обратно на замену индекса не чинить.
          pip install torch torchaudio --extra-index-url https://download.pytorch.org/whl/cpu
          # Импорта требуют только эти четыре; всё тяжёлое (transformers,
          # faster-whisper, rembg) грузится лениво внутри функций и в тестах не
          # выполняется. Ставить requirements.txt целиком — минуты ради ничего.
          # fonttools — парсинг таблиц шрифтов, замер ширины строк и автофит интро.
          # Pillow, pyarrow, zstandard — тесты drp, verify, boundaries, arrowfix.
          # Спецификаторы в кавычках: без них `>=` в bash — перенаправление вывода в файл «=10.0».
          # ruff и mypy — оба из requirements-dev.txt, строгий список типов в pyproject.toml.
          pip install flask numpy scipy soundfile pytest ruff mypy fonttools "pillow>=10.0" pyarrow "zstandard>=0.22"

      # Отрендеренный .jsx (шаблон AE_FULL с подстановками) проверяет node
      # (test_rendered_jsx_syntax.py): сам шаблон может быть валиден, а сборка —
      # сломаться на тексте из XML. Битый .jsx роняет импорт и весь проект AE.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Lint
        run: ruff check .

      # Строгая типизация на границе ядра: список модулей — в
      # [tool.mypy] pyproject.toml, храповик, который не даёт ему сжаться, —
      # tests/test_typing_ratchet.py (в прогоне тестов ниже он видит уже
      # установленный mypy и проверяет то же самое).
      - name: Type check
        run: mypy

      - name: Tests
        run: python -m pytest tests -q

  test-windows:
    if: github.repository == 'mxmlab/reelsi'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --extra-index-url https://download.pytorch.org/whl/cpu
          # Дополняем PyPI индексом pytorch, а не заменяем — почему, разобрано в джобе test.
          pip install flask numpy scipy soundfile pytest fonttools "pillow>=10.0" pyarrow "zstandard>=0.22"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Tests
        run: python -m pytest tests -q

  # Секреты во всей истории и уязвимые зависимости. Джоба самостоятельная: от test
  # не зависит и идёт с ним параллельно — незачем ждать сборку torch, чтобы узнать
  # про утёкший ключ.
  scan:
    if: github.repository == 'mxmlab/reelsi'
    runs-on: ubuntu-latest
    env:
      # Версия закреплена: в новой могут смениться правила, и сборка покраснеет
      # на находках, которых раньше не было. Обновлять осознанно.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v5
        with:
          # Вся история, а не последний коммит: с глубиной по умолчанию gitleaks
          # видит один коммит, и проверка секретов вырождается в пустую.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # Бинарник релиза, а не action из маркетплейса: action требует лицензию для
      # организаций. Заведомо ложные срабатывания перечислены в .gitleaks.toml,
      # правило generic-api-key там не глушится целиком.
      - name: Scan history for secrets (gitleaks)
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --redact -c .gitleaks.toml .

      - name: Audit dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  smoke:
    if: github.repository == 'mxmlab/reelsi'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Минимальные зависимости верхнеуровневых импортов для --help точек входа:
      # sync/vad (numpy, scipy), gigaam_cut.pipeline/tune (soundfile).
      # compileall зависимостей не требует (проверяет только синтаксис).
      - name: Install minimal dependencies for CLI smoke
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy soundfile
          pip install -e . --no-deps

      - name: Byte-compile all modules
        run: python -m compileall -q api core tools tests webui.py reelsi.py doctor.py

      - name: Check CLI entry points help
        env:
          PYTHONIOENCODING: utf-8
        run: |
          reelsi --help
          python -c 'import importlib.metadata as im; eps = {e.name: e.value for e in im.entry_points(group="console_scripts")}; assert "reelsi-webui" in eps and eps["reelsi-webui"] == "webui:main", f"reelsi-webui: {eps}"; assert "reelsi-doctor" in eps and eps["reelsi-doctor"] == "doctor:main", f"reelsi-doctor: {eps}"'
          python reelsi.py --help
          python -m core.omni_cut --help
          python -m core.gigaam_cut --help

  requirements:
    if: github.repository == 'mxmlab/reelsi'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # 2026-08-09: pip 22.x читал requirements в системной кодировке (на
      # Windows это cp1252) и падал UnicodeDecodeError на не-ASCII комментариях.
      # Джоба повторяет тот прогон: файлы обязаны читаться и старым pip
      # (system encoding), и современным (utf-8-sig), и парситься pip'ом без
      # установки чего-либо (--dry-run --no-deps ничего не качает).
      - name: Requirements must parse on Windows
        shell: pwsh
        run: |
          python -m pip install --dry-run --no-deps -r requirements.txt -r requirements-optional.txt -r requirements-dev.txt
          python -c "import locale; enc = locale.getpreferredencoding(False); files = ('requirements.txt','requirements-optional.txt','requirements-dev.txt'); [open(f, encoding=enc).read() for f in files]; [open(f, encoding='utf-8-sig').read() for f in files]"

  jsx:
    if: github.repository == 'mxmlab/reelsi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # ExtendScript, который уезжает в After Effects, синтаксически проверяем тем же
      # способом, что и verify_jsx.py: node --check не принимает расширение .jsx,
      # поэтому копируем в .js. Битый .jsx роняет импорт и весь проект AE, а узнать
      # об этом иначе можно только открыв Adobe.
      - name: Check ExtendScript syntax
        run: |
          status=0
          for f in $(git ls-files '*.jsx'); do
            cp "$f" "/tmp/$(basename "$f" .jsx).js"
            if node --check "/tmp/$(basename "$f" .jsx).js"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              status=1
            fi
          done
          exit $status

      # JS самого интерфейса — шаг в ТОЙ ЖЕ джобе, а не отдельная: node уже стоит.
      # Раньше static/app/*.js не проверялся ничем: пятнадцать обычных <script> в общем
      # скоупе, и синтаксическая ошибка в одном убивает страницу целиком, причём
      # python-тесты её не видят — они читают код регулярками. Имена файлов те же, что
      # грузит webui.py (_app_scripts собирает теги по содержимому папки).
      - name: Check frontend JS syntax
        run: |
          status=0
          for f in static/app/*.js; do
            if node --check "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              status=1
            fi
          done
          exit $status
