# Линтер для CI. Набор правил намеренно узкий.
#
# На 20k строк живого кода полный ruff выдаёт под тысячу замечаний — почти всё это
# вкусовщина (printf-форматирование, порядок импортов, голые except). Красный CI, в
# котором тонут настоящие поломки, хуже отсутствующего: его перестают читать.
#
# Здесь только то, что означает СЛОМАНО: синтаксис (E9), неопределённые имена (F82),
# невыполнимые тесты и мёртвые сравнения (F63, F7), неиспользуемые импорты и
# переменные (остальной F) — последнее ловит опечатки в именах и забытый код.
#
# Расширять набор — отдельной задачей, по одному правилу с разовой зачисткой, а не
# включением всего сразу.
line-length = 100

[lint]
select = ["E9", "F"]
