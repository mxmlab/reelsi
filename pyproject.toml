[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reelsi"
version = "0.2.0b0"
description = "AI video editor on top of Premiere and After Effects: multicam cut, word-by-word subtitles, AE assembly"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
reelsi = "reelsi:main"
reelsi-webui = "webui:main"
reelsi-doctor = "doctor:main"

[tool.setuptools]
py-modules = ["webui", "reelsi", "doctor"]

[tool.setuptools.packages.find]
include = ["core*", "api*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
optional-dependencies.optional = {file = ["requirements-optional.txt"]}
optional-dependencies.dev = {file = ["requirements-dev.txt"]}

# Строгая типизация на ГРАНИЦЕ ядра (внешнее ревью 2026-09-22).
#
# Сплошь аннотировать 110 тысяч строк бессмысленно: это работа на месяцы и
# гарантированные ошибки переноса. Поэтому строгий список — это модули, которые
# зовут все остальные (пути, файловый ввод-вывод, медиа, метаданные приложения,
# рендер, работа с камерой, .project.json), и храповик
# (tests/test_typing_ratchet.py), который не даёт списку сжиматься.
#
# follow_imports = silent: чужие модули разбираются, но их ошибки НЕ показываются.
# Без этого `mypy` тонул бы в замечаниях к 110 тысячам неаннотированных строк и
# «ноль ошибок» стало бы недостижимо ни при какой правке.
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
follow_imports = "silent"
files = [
    "core/umsg.py",
    "core/fileio.py",
    "core/media.py",
    "core/paths.py",
    "core/app_meta.py",
    "core/aerender.py",
    "core/cams.py",
    "core/rclone.py",
    "core/xml2ae/__init__.py",
    "core/xml2ae/__main__.py",
    "core/xml2ae/build.py",
    "core/xml2ae/highlights.py",
    "core/xml2ae/jsutil.py",
    "core/xml2ae/layout.py",
    "core/xml2ae/parse.py",
    "core/xml2ae/plan_assets.py",
    "core/xml2ae/plan_audio.py",
    "core/xml2ae/plan_camera.py",
    "core/xml2ae/plan_decor.py",
    "core/xml2ae/plan_inserts.py",
    "core/xml2ae/plan_intro.py",
    "core/xml2ae/plan_intro_tpl.py",
    "core/xml2ae/plan_style.py",
    "core/xml2ae/plan_subs.py",
    "core/xml2ae/plan_words.py",
    "core/xml2ae/template.py",
    "core/aicut/config_actions.py",
    "core/project_file.py",
    "core/cutjob.py",
    "api/__init__.py",
    "api/_core.py",
    "api/ai.py",
    "api/build.py",
    "api/editor.py",
    "api/files.py",
    "api/gdrive.py",
    "api/inserts.py",
    "api/jobs.py",
    "api/presets.py",
    "api/previewproxy.py",
    "api/render.py",
    "api/videogen.py",
]

# disallow_untyped_defs — ровно для строгого списка: публичные функции и методы
# обязаны быть аннотированы полностью, иначе список «проходит mypy» и ничего не
# значит. Остальной код живёт как жил.
[[tool.mypy.overrides]]
module = [
    "core.umsg",
    "core.fileio",
    "core.media",
    "core.paths",
    "core.app_meta",
    "core.aerender",
    "core.cams",
    "core.rclone",
    "core.xml2ae.__init__",
    "core.xml2ae.__main__",
    "core.xml2ae.build",
    "core.xml2ae.highlights",
    "core.xml2ae.jsutil",
    "core.xml2ae.layout",
    "core.xml2ae.parse",
    "core.xml2ae.plan_assets",
    "core.xml2ae.plan_audio",
    "core.xml2ae.plan_camera",
    "core.xml2ae.plan_decor",
    "core.xml2ae.plan_inserts",
    "core.xml2ae.plan_intro",
    "core.xml2ae.plan_intro_tpl",
    "core.xml2ae.plan_style",
    "core.xml2ae.plan_subs",
    "core.xml2ae.plan_words",
    "core.xml2ae.template",
    "core.aicut.config_actions",
    "core.project_file",
    "core.cutjob",
    "api.__init__",
    "api._core",
    "api.ai",
    "api.build",
    "api.editor",
    "api.files",
    "api.gdrive",
    "api.inserts",
    "api.jobs",
    "api.presets",
    "api.previewproxy",
    "api.render",
    "api.videogen",
]
disallow_untyped_defs = true
