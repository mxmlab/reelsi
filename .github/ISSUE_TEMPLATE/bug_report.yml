name: Bug report
description: Something behaves wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: run `python doctor.py` and paste its output below. It
        includes your Reelsi version (first line) and environment details in one go,
        which saves a round trip.

        **Security issues do not belong here** — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `python doctor.py` (includes Reelsi version)
      description: Run `python doctor.py` and paste the full output here (first line shows version).
      render: text
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Which stage
      options:
        - Cutting (silence / AI cut)
        - Transcription and subtitles
        - Markup (highlights, inserts, intro)
        - After Effects export (.jsx)
        - Rotoscoping
        - Draft render
        - Web UI
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Server console output, and the browser console if it's a UI problem.
        For pipeline problems, attach the generated `.xml` or `.jsx`.
        **Strip anything personal first** — these files contain your transcript.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed personal content from anything I attached
          required: true
        - label: If it's an After Effects problem, I re-ran `core/verify_jsx.py` on a freshly built .jsx (old ones on disk are not regenerated by a code change)
