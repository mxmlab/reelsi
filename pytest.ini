[pytest]
python_files = test_*.py
testpaths = tests
# Таймаут на каждый тест: 120 секунд (самый долгий тест в наборе длится ~38 с <= 40 с).
# Метод thread работает кроссплатформенно на Windows и Linux (в отличие от signal/SIGALRM,
# который доступен только на POSIX-системах).
timeout = 120
timeout_method = thread
markers =
    allow_self_signal: разрешает тесту отправлять сигнал собственному процессу (os.getpid())
    # Бюджет времени, а не логика: такой тест меряет скорость раннера, и на медленной
    # машине он падает на ровном месте. В CI джобы идут с -m "not perf"; локально — идут.
    perf: тест бюджета времени (в CI исключается флагом -m "not perf")
